  <h1>Установка</h1>
<div id="toc"></div>
<div id="toccontent">

<h2>Установка из репозитория вашего дистрибутива</h2>
<p>Самый простой способ установки Flowblade — это установка версии из репозитория вашего дистрибутива. Основным недостатком такой установки может стать устаревшая версия видеоредактора. Если в репозитории вашего дистрибутива находится старая версия Flowblade или отсутствует вовсе, сообщите об этом его разработчикам.</p>

<h3>Alt Linux</h3>
<div class="box-text">Источник: <a href="https://vk.com/@kirov_osc-ustanovka-flowblade-v-alt-linux" target="_blank" rel="noreferrer noopener" title="Открыть в новой вкладке">Установка Flowblade в ALT Linux.</a></div>
<ul>
	<li><p>С помощью терминала подключите репозиторий Сизиф:</p>
	<div class="code-text">sudo apt-repo rm all<br />sudo apt-repo add sisyphus</div>
	</li>
	<li><p><p>Обновите список репозиториев:</p></p>
	<div class="code-text">sudo apt-get update</div>
	</li>
	<li><p>Задайте команду установки:</p>
	<div class="code-text">sudo apt-get install flowblade</div>
	</li>
</ul>

<h3>Arch Linux</h3>
<ul>
	<li><p>Включите репозиторий сообщества в /etc/pacman.conf:</p>
	<div class="box-text">[community]<br>
Include = /etc/pacman.d/mirrorlist</div>
	<li><p>Задайте команду установки:</p>
	<div class="code-text">pacman -Syu flowblade</div>
	</li>
</ul>
<h3>Debian, Ubuntu и Linux Mint</h3>
<ul>
	<li><p>Обновите список репозиториев:</p>
	<div class="code-text">sudo apt update</div>
	<li><p>Задайте команду установки:</p>
	<div class="code-text">sudo apt install flowblade</div>
	</li>
</ul>
<h3>Fedora</h3>
<ul>
	<li><p>Загрузите последнюю версию rpmfusion-free-release-stable с:</p>
<div class="box-text">http://download1.rpmfusion.org/free/fedora/</div>
        <li><p>Установите rpmfusion-free-release-stable rpm:</p>
	<div class="code-text">sudo rpm -Uvh rpmfusion-free-release-stable*rpm</div>
	<li><p>Задайте команду установки:</p>
	<div class="code-text">sudo dnf install flowblade</div>
	</li>
</ul>
<h3>OpenMandriva</h3>
<ul>
	<li><p>Включите репозиторий в приложении выбора репозитория (om-repo-picker)</p>
	<li><p>Задайте команду установки:</p>
        <div class="code-text">sudo dnf install flowblade</div>
	</li>
</ul>
<h3>ROSA Desktop Fresh</h3>
<ul>
	<li><p>Откройте терминал и задайте команду:</p>
	<div class="code-text">sudo dnf install flowblade</div>
	</li>
</ul>
<h2>Установка через Flatpak</h2>
<p>Flowblade также можно установить через <a href="https://flatpak.org/setup/" target="_blank" rel="noreferrer noopener" title="Открыть в новой вкладке">Flatpak</a>.</p>
<p>Если в вашем дистрибутиве присутствует приложение Gnome SOFTWARE, вы можете установить Flowblade из него.</p>
<p><b>Можно через терминал:</b></p>
<ul>
	<li><p>Команда установки</p>
	<div class="code-text">flatpak install flathub io.github.jliljebl.Flowblade</div>
	<li><p>Команда запуска</p>
	<div class="code-text">flatpak run io.github.jliljebl.Flowblade</div>
	</li>
</ul>
<h2>Запуск без установки (из исходного кода)</h2>
<p>Flowblade в настоящее время на 100% является скриптовым приложением, а все зависимости должны быть доступны в популярных дистрибутивах. Поэтому, в большинстве случаев, как стабильную так и разрабатываемую версии Flowblade можно запустить без компиляции.</p>
<ul>
<li><p>В начале скачайте архив с исходным кодом с нужной стабильной версией <a href="https://github.com/jliljebl/flowblade/releases" target="_blank" rel="noreferrer noopener" title="Открыть в новой вкладке">отсюда</a> и распакуйте архив в любую папку. Если вы хотите попробовать разрабатываемую версию выполните следующие действия с помощью терминала:</p>
	<li><p>Установите Git в вашей системе (к примеру в Ubuntu)
	<div class="code-text">sudo apt-get install git</div>
	<li><p>Скачайте Flowblade c Git репозитория</p>
	<div class="code-text">git clone https://github.com/jliljebl/flowblade.git</div>
<li>Установите зависимости. Информацию о необходимых зависимостях можно посмотреть в разделе <a href="https://github.com/jliljebl/flowblade/blob/master/flowblade-trunk/docs/DEPENDENCIES.md" target="_blank" rel="noreferrer noopener" title="Открыть в новой вкладке">Зависимости</a>.</li>
</ul>
<p>Если в вашей системе Flowblade был установлен ранее, все необходимые зависимости также должны были установиться. Но помним, что могли быть добавлены новые.</p>
<ul>
<li>Запустите файл <b>flowblade</b>, который должен находится в распакованной  или скачанной папке по адресу <b>.../flowblade-trunk/flowblade</b>.</li>
	</ul></div>
	<p div class="box-text">ОБРАТИТЕ ВНИМАНИЕ: если в вашей системе Flowblade уже установлен, для запуска сценария вам потребуется указать полный путь к запускаемой версии или открыть терминал в папке, содержащей сценарий запуска и задать команду <span>./flowblade</span>, во избежании запуска установленной версии.</div></p>
<center><p div class="box-text" ><b>Windows</b> и <b>OS X</b> не поддерживаются. Разработчики Flowblade сосредоточены на предоставлении наилучшей поддержки в <b>Linux</b> и в других свободных платформах.</div></p></center>
